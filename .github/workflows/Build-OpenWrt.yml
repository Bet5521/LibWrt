# =============================================================
#  公共编译模板（架构参照 laipeng668/openwrt-ci-roc，即 LibWrt 作者本人的云编译项目）
#  要点：
#   1) 源码 git clone 到 /mnt/openwrt，不用 actions/checkout 拉大仓库
#   2) 依赖用 LibWrt README 的官方完整清单
#   3) make download 失败重试 3 次（make download 报错是正常现象，见上游 issue #153）
#   4) make -j$(nproc) 失败自动降级 make -j1 V=s（拿到真正报错行）
#   5) ccache + staging_dir 缓存，二次编译从 1~2 小时降到 10~20 分钟
# =============================================================
name: Build-OpenWrt

on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      config_file:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      release_summary:
        required: false
        type: string
        default: '京东云 AX1800 Pro 亚瑟 · 精简满血 NSS'
      make_release:
        required: false
        type: boolean
        default: true
      # ==================== 按需自定义（全部可选，都有默认值）====================
      # 说明：这一组输入让"每次点 Run workflow"都能改 LAN 地址 / 无线初始状态 / 组件。
      #       类型统一用 string（而不是 boolean），是为了让 push / schedule 这类
      #       没有 inputs 上下文的触发方式能用 `|| '默认值'` 兜底，避免被空值覆盖。
      # ---------- LAN / 系统 ----------
      lan_ip:
        required: false
        type: string
        default: '192.168.1.1'
      lan_netmask:
        required: false
        type: string
        default: '255.255.255.0'
      lan_dns:
        required: false
        type: string
        default: '223.5.5.5'
      hostname:
        required: false
        type: string
        default: 'LibWrt'
      timezone:
        required: false
        type: string
        default: 'Asia/Shanghai'
      root_password:
        required: false
        type: string
        default: ''
      # ---------- 无线 ----------
      wifi_enabled:
        required: false
        type: string
        default: 'on'
      wifi_ssid:
        required: false
        type: string
        default: 'JDC-AX1800Pro'
      wifi_password:
        required: false
        type: string
        default: 'password12345'
      wifi_country:
        required: false
        type: string
        default: 'CN'
      wifi_channel_2g:
        required: false
        type: string
        default: '6'
      wifi_htmode_2g:
        required: false
        type: string
        default: 'HE20'
      wifi_channel_5g:
        required: false
        type: string
        default: '36'
      wifi_htmode_5g:
        required: false
        type: string
        default: 'HE80'
      # ---------- 组件 / 功能 ----------
      extra_packages:
        required: false
        type: string
        default: ''
      remove_packages:
        required: false
        type: string
        default: ''
      # ---------- 自定义 feed 源 ----------
      # 每行一个，格式（三种都认）：
      #   <name> <url>[;<branch>]
      #   src-git <name> <url>[;<branch>]
      #   <url>[;<branch>]              # 自动从 URL 推 name
      # 例：kenzo https://github.com/kenzok8/openwrt-packages.git;main
      extra_feeds:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      repo_url:
        description: '源码仓库'
        required: true
        default: 'https://github.com/Bet5521/LibWrt.git'
      repo_branch:
        description: '源码分支'
        required: true
        default: '25.12-nss'
      config_file:
        description: 'config 文件路径'
        required: true
        default: 'configs/IPQ60XX.config'
      artifact_prefix:
        description: '产物前缀'
        required: true
        default: 'IPQ60XX'
      release_summary:
        description: 'Release 说明'
        required: false
        default: '京东云 AX1800 Pro 亚瑟 · 精简满血 NSS'
      make_release:
        description: '是否发布 Release'
        required: false
        type: boolean
        default: true
      # ---------- LAN / 系统 ----------
      lan_ip:
        description: 'LAN IP（路由器管理地址）'
        required: false
        default: '192.168.1.1'
      lan_netmask:
        description: 'LAN 子网掩码'
        required: false
        default: '255.255.255.0'
      lan_dns:
        description: 'LAN 下发的 DNS'
        required: false
        default: '223.5.5.5'
      hostname:
        description: '主机名'
        required: false
        default: 'LibWrt'
      timezone:
        description: '时区'
        required: false
        default: 'Asia/Shanghai'
      root_password:
        description: 'root 密码（留空=无密码）'
        required: false
        default: ''
      # ---------- 无线 ----------
      wifi_enabled:
        description: '无线初始状态'
        required: false
        type: choice
        options:
          - 'on'
          - 'off'
        default: 'on'
      wifi_ssid:
        description: 'WiFi 名称（5G 会自动加 _5G 后缀）'
        required: false
        default: 'JDC-AX1800Pro'
      wifi_password:
        description: 'WiFi 密码（至少 8 位）'
        required: false
        default: 'password12345'
      wifi_country:
        description: '无线国家码'
        required: false
        default: 'CN'
      wifi_channel_2g:
        description: '2.4G 信道'
        required: false
        default: '6'
      wifi_htmode_2g:
        description: '2.4G 频宽/模式'
        required: false
        type: choice
        options:
          - 'HE20'
          - 'HE40'
          - 'HT20'
          - 'HT40'
        default: 'HE20'
      wifi_channel_5g:
        description: '5G 信道（36/149 非 DFS）'
        required: false
        default: '36'
      wifi_htmode_5g:
        description: '5G 频宽/模式'
        required: false
        type: choice
        options:
          - 'HE80'
          - 'HE160'
          - 'HE40'
          - 'VHT80'
        default: 'HE80'
      # ---------- 组件 / 功能 ----------
      extra_packages:
        description: '额外加入的包（空格/逗号分隔，可多行）'
        required: false
        default: ''
      remove_packages:
        description: '要移除的包（空格/逗号分隔，可多行）'
        required: false
        default: ''
      extra_feeds:
        description: '自定义 feed 源（每行一个：<name> <url>[;branch]，留空=只用源码默认 feeds）'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  OPENWRT_PATH: /mnt/openwrt
  CONFIG_DIR: configs
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_name: ${{ steps.vars.outputs.artifact_name }}
      version_kernel: ${{ steps.source.outputs.version_kernel }}
      version_info: ${{ steps.source.outputs.version_info }}
      firmware_tag: ${{ steps.tag.outputs.firmware_tag }}
      ccache_key: ${{ steps.vars.outputs.ccache_key }}
      staging_key: ${{ steps.vars.outputs.staging_key }}
    permissions:
      contents: read
    steps:
      # ---------- 0 检出本仓库（只拉本仓库，很小）----------
      - name: Checkout(检出本仓库)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Server Info(服务器信息)
        run: |
          echo "--- CPU ---"; grep -c ^processor /proc/cpuinfo
          echo "--- 内存 ---"; free -h
          echo "--- 磁盘 ---"; df -hT /

      # ---------- 1 依赖（LibWrt README 官方清单）----------
      - name: Initialization Environment(安装依赖)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            zstd lz4 liblzma-dev
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          echo "--- 自检 ---"
          for c in make gcc g++ perl patch gperf rsync unzip xz zstd; do
            printf '%-10s %s\n' "$c" "$(command -v "$c" || echo MISSING)"
          done

      # ---------- 2 clone 源码到 /mnt/openwrt ----------
      - name: Clone Source Code(克隆源码)
        id: source
        env:
          REPO_URL: ${{ inputs.repo_url }}
          REPO_BRANCH: ${{ inputs.repo_branch }}
        run: |
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
          for attempt in 1 2 3; do
            if git clone --depth 1 -b "$REPO_BRANCH" --single-branch "$REPO_URL" "$OPENWRT_PATH"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::源码 clone 失败（已重试 3 次）"
              exit 1
            fi
            echo "::warning::clone 失败，第 $attempt 次重试"
            sudo rm -rf "$OPENWRT_PATH"; sudo mkdir -p "$OPENWRT_PATH"
            sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
            sleep $((attempt * 5))
          done
          cd "$OPENWRT_PATH"
          ls -l scripts/feeds
          head -1 scripts/feeds
          VERSION_INFO="$(git show -s --date=short --format='时间: %cd<br/>内容: %s<br/>hash: %H')"
          {
            echo 'version_info<<EOF'
            echo "$VERSION_INFO"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          KERNEL_VER="$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-* 2>/dev/null | head -n1 || true)"
          echo "version_kernel=${KERNEL_VER:-unknown}" >> "$GITHUB_OUTPUT"

      # ---------- 3 更新 feeds ----------
      - name: Update Feeds(更新 feeds)
        run: |
          cd "$OPENWRT_PATH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------- 3.5 自定义 feed 源（可选）----------
      # 需求：默认只用源码自带的 feeds.conf.default，但允许在表单里追加第三方源
      #       （kenzo / small-package / 自建源 …）。
      #
      # 三个必须踩对的点：
      #  1) scripts/feeds 的读取顺序是 feeds.conf → feeds.conf.default（scripts/feeds:91）。
      #     若 feeds.conf 不存在，追加到它上面等于没写（根本读不到）。
      #     所以追加前先 cp feeds.conf.default feeds.conf。
      #  2) 逐条 update，而不是 update -a：第三方源挂掉是常态，
      #     绝不能让它把整条构建拖死 —— 单条失败就回滚那一行 + 告警，继续编译。
      #  3) install 用 -p <name> 只装该源的包，避免和默认源里的同名包互相覆盖。
      - name: Apply Feeds(应用 feed 源：仓库预置 + 表单自定义)
        env:
          EXTRA_FEEDS: ${{ inputs.extra_feeds }}
        run: |
          cd "$OPENWRT_PATH"
    
          CONF="feeds.conf"
          DEFAULT="feeds.conf.default"
          # 仓库预置 feed 就写在 CI 仓库自己的 feeds.conf.default 里（已 checkout 到工作区）
          PRESET="$GITHUB_WORKSPACE/feeds.conf.default"
    
          ADDED=""
          FAILED=""
    
          # feeds.conf 不存在时补上：scripts/feeds 只读 feeds.conf，
          # 缺文件才会回退读 feeds.conf.default —— 追加到不存在的文件等于没写。
          ensure_conf() {
            [ -f "$CONF" ] && return 0
            if [ -f "$DEFAULT" ]; then
              cp "$DEFAULT" "$CONF"
              echo "[feeds] 已由 feeds.conf.default 生成 feeds.conf"
            else
              : > "$CONF"
              echo "::warning::源码既无 feeds.conf 也无 feeds.conf.default，新建空 feeds.conf"
            fi
          }
    
          # 按 feed 名判断是否已存在（优先看 feeds.conf，没有该文件就看 feeds.conf.default，
          # 因为那正是 scripts/feeds 的回退读法）。$1 是已转义的 name 正则片段。
          feed_exists() {
            local f="$CONF"
            [ -f "$f" ] || f="$DEFAULT"
            [ -f "$f" ] || return 1
            grep -qE "^src-[a-z-]+[[:space:]]+$1([[:space:]]|$)" "$f"
          }
    
          # grep -E 里只有 . 是元字符（名字已被限制在 [A-Za-z0-9._-] 内）
          re_escape() { printf '%s' "$1" | sed 's/\./\\./g'; }
    
          # 去重：同一个源被处理多次时只记一次，避免重复 install
          add_name() {
            case " $ADDED " in
              *" $1 "*) ;;
              *) ADDED="$ADDED $1" ;;
            esac
          }
    
          # 追加一个 feed：update 失败即回滚那一行；install 失败只告警
          # $1=name  $2=url(可带 ;branch)  $3=来源描述
          add_feed() {
            local name="$1" url="$2" origin="$3"
            ensure_conf
            printf 'src-git %s %s\n' "$name" "$url" >> "$CONF"
            echo "[feeds] + ${name} ← ${url}   （来源：${origin}）"
            if ./scripts/feeds update "$name" > "/tmp/feeds_up_${name}.log" 2>&1; then
              echo "[feeds] [OK] update: ${name}"
              if ./scripts/feeds install -a -p "$name" > "/tmp/feeds_in_${name}.log" 2>&1; then
                echo "[feeds] [OK] install: ${name}"
              else
                echo "::warning::来源 ${name} 的包安装存在失败项（多为个别包依赖缺失），继续构建"
                grep -iE "warn|fail|error|not found|skip" "/tmp/feeds_in_${name}.log" 2>/dev/null | tail -n 15 || true
              fi
              add_name "$name"
            else
              echo "::warning::feed 源不可用，已回滚并从构建中剔除: ${name} ${url}"
              tail -n 20 "/tmp/feeds_up_${name}.log" 2>/dev/null || true
              sed -i "/^src-[a-z-]*[[:space:]]\+${name}[[:space:]]/d" "$CONF"
              FAILED="${FAILED} ${name}"
            fi
          }
    
          # ---------- A) 仓库预置 feed：只补源码里没有的（按名，绝不覆盖）----------
          if [ -f "$PRESET" ]; then
            echo "--- A) 仓库预置 feed（取自 ${PRESET}）---"
            while IFS= read -r raw; do
              pline="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              pname="$(printf '%s' "$pline" | awk '{print $2}')"
              purl="$(printf '%s' "$pline" | awk '{print $3}')"
              [ -n "$pname" ] && [ -n "$purl" ] || continue
              case "$pname" in
                */*) echo "::warning::预置 feed 名含 /，已跳过: ${pname}"; continue ;;
              esac
              if feed_exists "$(re_escape "$pname")"; then
                echo "[preset] 源码已自带 feed「${pname}」，保持源码版本不动"
                continue
              fi
              add_feed "$pname" "$purl" "本仓库 feeds.conf.default"
            done < <(awk '/^# *>>> *repo-extra-feeds/{f=1;next} /^# *<<< *repo-extra-feeds/{f=0} f' "$PRESET" \
                     | grep -E '^[[:space:]]*src-')
          else
            echo "::notice::未找到 ${PRESET}，跳过仓库预置 feed"
          fi
    
          # ---------- B) 表单自定义源：同名可覆盖 ----------
          norm_feeds() {
            printf '%s\n' "${EXTRA_FEEDS:-}" \
              | tr -d '\r' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | sed '/^$/d' \
              | sed '/^#/d'
          }
    
          if [ -z "$(norm_feeds | tr -d ' \r\n\t')" ]; then
            echo "[feeds] B) 表单未指定自定义 feed 源（extra_feeds 为空），跳过"
          else
            echo "--- B) 表单自定义 feed 源 ---"
            while IFS= read -r raw; do
              [ -n "$raw" ] || continue
    
              line="$raw"
              # 剥掉可选前缀，统一成 "<name> <url>"
              case "$line" in
                src-git-full\ *|src-git\ *|src-link\ *|src\ *)
                  line="$(printf '%s' "$line" | sed 's/^src-[a-z-]*[[:space:]]*//')" ;;
              esac
    
              name="$(printf '%s' "$line" | awk '{print $1}')"
              url="$(printf '%s' "$line" | awk '{print $2}')"
    
              # 只写了一个字段 → 当 URL，name 从 URL 推（与 scripts/feeds 的补全思路一致）
              if [ -z "$url" ]; then
                url="$name"
                name="$(printf '%s' "$url" | sed 's/;.*$//' | sed 's#^.*/##; s/\.git$//' \
                  | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_-]/-/g')"
              fi
    
              # name 会拼进 /tmp/<name>.log 的路径，也会进 sed/grep 表达式，
              # 所以先滤掉不安全字符（name 里带 / 会直接写坏 sed 命令、写坏日志路径）
              safe_name="$(printf '%s' "$name" | sed 's/[^A-Za-z0-9._-]/-/g')"
              if [ "$safe_name" != "$name" ]; then
                echo "::warning::feed 名含不安全字符，已改写为「${safe_name}」（原名：${name}）"
                name="$safe_name"
              fi
    
              if [ -z "$name" ] || [ -z "$url" ]; then
                echo "::warning::feed 行无法解析（需要 <name> <url>），已跳过: $raw"
                continue
              fi
    
              # 同名源：先删旧行，避免 feeds.conf 里出现两个同名 feed。
              # sed 用 / 作分隔符（name 已不含 /）；grep -E 里只剩 . 是元字符，单独转义
              name_re="$(re_escape "$name")"
              if feed_exists "$name_re"; then
                # 覆盖源码自带的 feed 影响面很大（例如把 packages 换成第三方源），必须显式告警
                if [ -f "$DEFAULT" ] && grep -qE "^src-[a-z-]+[[:space:]]+${name_re}([[:space:]]|$)" "$DEFAULT"; then
                  echo "::warning::正在覆盖源码自带 feed「${name}」——这会替换掉源码的默认源，可能导致编译失败: ${url}"
                else
                  echo "[feeds] 已有同名源，按新地址覆盖: ${name}"
                fi
                ensure_conf
                sed -i "/^src-[a-z-]*[[:space:]]\+${name}[[:space:]]/d" "$CONF"
              fi
    
              add_feed "$name" "$url" "表单 extra_feeds"
            done <<< "$(norm_feeds)"
          fi
    
          # ---------- 汇总（日志里一眼能看到最终用了哪几个源）----------
          echo "--- feed 源汇总 ---"
          echo "生效:${ADDED:- （无）}"
          echo "失败:${FAILED:- （无）}"
          # 注意：若一个 feed 都没追加，feeds.conf 可能根本不存在，
          # 这时绝不能直接 cat（set -e 会让整条构建挂掉）——
          # 例如 25.12 分支源码自带全部预置 feed，就是这种「全是空操作」的情况。
          echo "--- 当前 feed 配置 ---"
          if [ -f "$CONF" ]; then
            cat "$CONF"
          else
            echo "(未生成 ${CONF}，scripts/feeds 将直接读 ${DEFAULT})"
            grep -E '^[[:space:]]*src-' "$DEFAULT" 2>/dev/null || echo "(无)"
          fi
      - name: Generate Variables(生成变量)
        id: vars
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          cd "$OPENWRT_PATH"
          # （旧版这里有一行 SONAME="${REPO_URL##*/}"，但本步骤并没有注入 REPO_URL，
          #   取到的是空串，且 SONAME 后面也没被用到 —— 已删除。）
          ARTIFACT_NAME="firmware-${ARTIFACT_PREFIX}"
          HASH="$(git rev-parse HEAD)"; HASH="${HASH:0:7}"
          CACHE_PREFIX="openwrt-${RUNNER_OS}-${ARTIFACT_PREFIX}-${HASH}"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "ccache_key=${CACHE_PREFIX}-ccache"
            echo "staging_key=${CACHE_PREFIX}-staging"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
          } >> "$GITHUB_ENV"

      # ---------- 4.5 生成 Release 标签 ----------
      # 规则：<主机名>_<内核版本>_<config 名称>_<构建日期>
      #   例：JDC-AX1800Pro_6.12.108_IPQ60XX-minimal_2026-10-06
      # 为什么不放成输入项：内核版本只有 clone 完源码才知道，表单上填不出来；
      #   而主机名 / 档位 / 日期也都是确定的，硬编码一个 tag 反而会和实际产物对不上。
      - name: Generate Release Tag(生成 Release 标签)
        id: tag
        env:
          HOSTNAME: ${{ inputs.hostname }}
          CONFIG_FILE: ${{ inputs.config_file }}
          KERNEL_VERSION: ${{ steps.source.outputs.version_kernel }}
        run: |
          # Git tag 不接受空格 / ~ ^ : ? * [ \ 等字符，统一替换成下划线
          safe() { printf '%s' "$1" | sed -E 's/[^A-Za-z0-9._-]+/_/g; s/_+/_/g; s/^_+//; s/_+$//'; }

          CONFIG_NAME="$(basename "$CONFIG_FILE" .config)"
          BUILD_DATE="$(date '+%Y-%m-%d')"
          KERNEL="${KERNEL_VERSION:-unknown}"

          FIRMWARE_TAG="$(safe "$HOSTNAME")_$(safe "$KERNEL")_$(safe "$CONFIG_NAME")_$BUILD_DATE"
          {
            echo "firmware_tag=$FIRMWARE_TAG"
            echo "build_date=$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag = $FIRMWARE_TAG"

      - name: Cache Ccache(缓存 ccache)
        uses: actions/cache@v4
        with:
          key: ${{ steps.vars.outputs.ccache_key }}
          restore-keys: |
            openwrt-${{ runner.os }}-${{ inputs.artifact_prefix }}-ccache
          path: ${{ env.OPENWRT_PATH }}/.ccache

      - name: Cache Staging Directory(缓存工具链)
        uses: actions/cache@v4
        with:
          key: ${{ steps.vars.outputs.staging_key }}
          restore-keys: |
            openwrt-${{ runner.os }}-${{ inputs.artifact_prefix }}-staging
          path: ${{ env.OPENWRT_PATH }}/staging_dir

      # ---------- 5 应用 config ----------
      - name: Apply Config(应用 config)
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          cd "$OPENWRT_PATH"
          CONFIG_SRC="$GITHUB_WORKSPACE/$CONFIG_FILE"
          if [ ! -f "$CONFIG_SRC" ]; then
            echo "::error::找不到配置文件 $CONFIG_SRC"
            ls -R "$GITHUB_WORKSPACE/$CONFIG_DIR" || true
            exit 1
          fi
          cp "$CONFIG_SRC" .config
          # defconfig 之前先留一份快照，等下做 diff 才能发现「写了但本分支没有」的符号。
          grep -E '^CONFIG_[A-Za-z0-9_]+=y$' .config | sort -u > /tmp/cfg_before.txt
          make defconfig

          # 旧版这里是一个「同一符号既 =y 又是 # not set 就删掉」的循环，
          # 但 defconfig 已经把未知符号清干净了，那个条件永不成立 —— 纯空转。
          # 改成 defconfig 前后做符号 diff，真正把无效符号报出来（只警告，不中断）。
          echo "--- 本分支不存在的符号（defconfig 已丢弃，等于没写）---"
          grep -E '^CONFIG_[A-Za-z0-9_]+=y$' .config | sort -u > /tmp/cfg_after.txt
          comm -23 /tmp/cfg_before.txt /tmp/cfg_after.txt | while read -r line; do
            [ -n "$line" ] || continue
            echo "::warning::本分支无此符号，已被 defconfig 丢弃: ${line}"
          done

          echo "--- 关键项检查 ---"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET)|DEVICE_jdcloud_re-ss-01' .config || true
          grep -E '^CONFIG_PACKAGE_(kmod-qca-nss|nss-firmware|ath11k-firmware)' .config | head -12 || true

      # ---------- 5.2 目标 / 设备预检 ----------
      # 踩过的坑：config 里写了 CONFIG_TARGET_DEVICE_<board>_<subtarget>_DEVICE_<dev>=y，
      # 但源码树里根本没有这台设备 —— defconfig 会静默丢弃该符号，
      # 于是编译能跑满 60~90 分钟，最后以莫名其妙的错误收场，且产物根本不是目标机型。
      # 这里在编译前就把「机型不存在 / 子目标不产镜像」挡掉，1 分钟内给出可行动报错。
      - name: Validate Target Device(目标机型预检)
        run: |
          cd "$OPENWRT_PATH"
          BOARD="$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"$/\1/p' .config)"
          SUBTARGET="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\(.*\)"$/\1/p' .config)"
          RAW="$(grep -oE '^CONFIG_TARGET_DEVICE_[^=]*=y' .config | head -1)"
          DEV="${RAW#CONFIG_TARGET_DEVICE_}"; DEV="${DEV%=y}"; DEV="${DEV#*_DEVICE_}"
          echo "预检: BOARD=$BOARD SUBTARGET=$SUBTARGET DEVICE=${DEV:-<未指定>}"

          if [ -z "$BOARD" ] || [ -z "$SUBTARGET" ]; then
            echo "::error::.config 里没有有效的 CONFIG_TARGET_BOARD / CONFIG_TARGET_SUBTARGET"
            exit 1
          fi

          IMG="target/linux/$BOARD/image/$SUBTARGET.mk"
          if [ ! -f "$IMG" ]; then
            echo "::error::源码树里没有 $IMG —— 该源码不支持 $BOARD/$SUBTARGET"
            ls target/linux/ 2>/dev/null || true
            exit 1
          fi

          # source-only 子目标只出源码、不产镜像，必然刷不了机，直接挡掉
          TMK="target/linux/$BOARD/$SUBTARGET/target.mk"
          if [ -f "$TMK" ] && grep -qE 'FEATURES[[:space:]]*\+?=.*source-only' "$TMK"; then
            echo "::error::$TMK 里 FEATURES 含 source-only —— 该子目标不产镜像，编译无意义"
            echo "请换用支持本机型的源码分支（见 README 的『源码与机型支持』一节）。"
            exit 1
          fi

          if [ -n "$DEV" ]; then
            if grep -qE "^TARGET_DEVICES \+= ${DEV}$" "$IMG"; then
              echo "::notice::机型 $DEV 在源码中存在，目标有效。"
            else
              echo "::error::源码 $IMG 里没有机型 $DEV —— 当前源码不支持这台设备，编译注定失败。"
              echo "--- 该源码 $BOARD/$SUBTARGET 支持的机型如下，请换分支或改 config ---"
              grep -oE '^TARGET_DEVICES \+= .*' "$IMG" | awk '{print $3}' | sort || true
              exit 1
            fi
          fi

      # ---------- 5.5 组件自定义（加包 / 去包，可选）----------
      - name: Apply Package Selection(组件自定义)
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          REMOVE_PACKAGES: ${{ inputs.remove_packages }}
        run: |
          cd "$OPENWRT_PATH"
          norm() {
            printf '%s' "${1:-}" \
              | sed 's/，/\n/g' \
              | tr ',' '\n' | tr '\t' '\n' | tr ' ' '\n' \
              | sed 's/^CONFIG_PACKAGE_//' | sed '/^$/d'
          }
          ADD="$(norm "$EXTRA_PACKAGES")"
          DEL="$(norm "$REMOVE_PACKAGES")"

          if [ -z "$ADD" ] && [ -z "$DEL" ]; then
            echo "未指定额外组件，沿用 config 文件默认值"
            exit 0
          fi

          while read -r p; do
            [ -n "$p" ] || continue
            sed -i "\|^CONFIG_PACKAGE_${p}=|d" .config
            echo "CONFIG_PACKAGE_${p}=y" >> .config
            echo "[+包] $p"
          done <<< "$ADD"

          while read -r p; do
            [ -n "$p" ] || continue
            sed -i "\|^CONFIG_PACKAGE_${p}=|d" .config
            echo "CONFIG_PACKAGE_${p}=n" >> .config
            echo "[-包] $p"
          done <<< "$DEL"

          make defconfig

          echo "--- 校验生效情况 ---"
          for p in $ADD; do
            [ -n "$p" ] || continue
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "[OK]   $p"
            else
              echo "::warning::包未生效（名字写错或本分支没有）: $p"
            fi
          done
          for p in $DEL; do
            [ -n "$p" ] || continue
            if grep -qE "^CONFIG_PACKAGE_${p}=n$|^# CONFIG_PACKAGE_${p} is not set$" .config; then
              echo "[已关] $p"
            else
              echo "::warning::未能关闭（可能被其他包依赖）: $p"
            fi
          done
          echo "（未生效的包只警告，不中断编译）"

      # ---------- 6 初始状态自定义：LAN / 无线 / 主机名 / 密码 ----------
      - name: Load Custom Configuration(加载自定义配置)
        env:
          DIY_LAN_IP: ${{ inputs.lan_ip }}
          DIY_LAN_NETMASK: ${{ inputs.lan_netmask }}
          DIY_LAN_DNS: ${{ inputs.lan_dns }}
          DIY_HOSTNAME: ${{ inputs.hostname }}
          DIY_TIMEZONE: ${{ inputs.timezone }}
          DIY_ROOT_PASSWORD: ${{ inputs.root_password }}
          DIY_WIFI_ENABLED: ${{ inputs.wifi_enabled }}
          DIY_WIFI_SSID: ${{ inputs.wifi_ssid }}
          DIY_WIFI_PASSWORD: ${{ inputs.wifi_password }}
          DIY_WIFI_COUNTRY: ${{ inputs.wifi_country }}
          DIY_WIFI_CHANNEL_2G: ${{ inputs.wifi_channel_2g }}
          DIY_WIFI_HTMODE_2G: ${{ inputs.wifi_htmode_2g }}
          DIY_WIFI_CHANNEL_5G: ${{ inputs.wifi_channel_5g }}
          DIY_WIFI_HTMODE_5G: ${{ inputs.wifi_htmode_5g }}
        run: |
          cd "$OPENWRT_PATH"
          if [ -f "$GITHUB_WORKSPACE/ci/diy.sh" ]; then
            bash "$GITHUB_WORKSPACE/ci/diy.sh" || echo "::warning::diy.sh 非 0 退出，继续"
          else
            echo '无 ci/diy.sh，跳过'
          fi
          echo "--- 自定义结果核对 ---"
          echo "[wireless]"
          sed -n '1,30p' "$OPENWRT_PATH/files/etc/config/wireless" 2>/dev/null || echo '(未生成 wireless 自定义)'
          echo "[uci-defaults 99-diy-custom]"
          sed -n '1,45p' "$OPENWRT_PATH/files/etc/uci-defaults/99-diy-custom" 2>/dev/null || echo '(未生成 99-diy-custom)'
          echo "[crontabs]"
          cat "$OPENWRT_PATH/files/etc/crontabs/root" 2>/dev/null || echo '(未生成 crontab)'

      # ---------- 7 下载 dl（重试 3 次；报错属正常，见上游 issue #153）----------
      - name: Download DL Package(预下载源码包)
        run: |
          cd "$OPENWRT_PATH"
          echo "::notice::预下载源码包首次约需 10~25 分钟（有缓存时 1~3 分钟）。此步无实时输出属正常，请勿取消。"
          mkdir -p dl
          # 后台每 45 秒报一次体积，避免看起来像卡死
          ( while :; do sleep 45; echo "[dl $(date +%H:%M:%S)] $(du -sh dl 2>/dev/null | cut -f1) / 待下 $(find dl -type f -size -1024c 2>/dev/null | wc -l) 个残片"; done ) &
          DL_PID=$!
          for attempt in 1 2 3; do
            if make download -j"$(nproc)"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::make download 连续 3 次未全成功，仍继续编译（上游说明属正常）"
              break
            fi
            echo "::warning::make download 第 $attempt 次未完成，清理残缺文件后重试"
            find dl -type f -size -1024c -print -delete 2>/dev/null || true
            sleep $((attempt * 5))
          done
          kill "$DL_PID" 2>/dev/null || true
          echo "[dl] 预下载完成，体积 $(du -sh dl 2>/dev/null | cut -f1)"
          df -hT "$OPENWRT_PATH" | tail -1

      # ---------- 8 编译（多线程失败自动降级单线程详细日志）----------
      - name: Compile Firmware(开始编译)
        run: |
          cd "$OPENWRT_PATH"
          export COMPILE_LOG="$RUNNER_TEMP/compile.log"
          echo "COMPILE_LOG=$COMPILE_LOG" >> "$GITHUB_ENV"
          echo "::notice::编译首次约需 40~90 分钟（有 ccache/staging 缓存时 10~25 分钟）。"
          echo "$(nproc) 线程编译"
          # 先并行编译（快）；失败则降级单线程 + V=s 拿到真正的报错行。
          # 两路输出都 tee 进日志，供失败诊断步骤回写。
          make -j"$(nproc)" BUILD_LOG=1 2>&1 | tee -a "$COMPILE_LOG" || {
            echo "::warning::并行编译失败，降级 make -j1 V=s 以定位报错"
            make -j1 V=s 2>&1 | tee -a "$COMPILE_LOG"
          }
          echo "[compile] 结束，日志 $(wc -l < "$COMPILE_LOG" 2>/dev/null || echo '?') 行"

      # ---------- 9 整理产物 ----------
      - name: Organize Files(整理产物)
        id: organize
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          cd "$OPENWRT_PATH"/bin/targets/*/*
          echo "--- 产物清单 ---"
          ls -lh
          cp "$OPENWRT_PATH/.config" "$ARTIFACT_PREFIX.config"
          [ -f config.buildinfo ] && mv config.buildinfo "$ARTIFACT_PREFIX.config.buildinfo" || true
          for f in *.manifest; do [ -e "$f" ] && mv "$f" "$ARTIFACT_PREFIX.manifest"; done
          rm -rf packages feeds.buildinfo version.buildinfo sha256sums profiles.json || true
          echo "firmware_path=$PWD" >> "$GITHUB_OUTPUT"

      - name: Upload Firmware Artifact(上传产物)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.organize.outputs.firmware_path }}/*
          if-no-files-found: error
          retention-days: 30

      # ---------- 失败诊断回写 ----------
      # 目的：把"哪一步、哪条命令、什么错误"写进仓库的一个独立分支，
      # 这样即使没有 token（读不到 Actions 日志），也能直接 clone 那个分支看原因。
      # 权限：push 需要 contents:write。本文件 Build job 里虽然写的是 read，
      #       但被复用调用时权限由【调用方】IPQ60XX-JDCloud.yml 的 permissions
      #       覆盖（那里给了 contents:write），所以这一步是真能推上去的，无需修改。
      - name: Write Diagnostics On Failure(失败时回写诊断)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          LOG="workflow-diag.txt"
          {
            echo "===== LibWrt 云编译失败诊断 ====="
            echo "仓库   : $GITHUB_REPOSITORY"
            echo "分支   : ${{ inputs.repo_branch }}"
            echo "提交   : $GITHUB_SHA"
            echo "事件   : $GITHUB_EVENT_NAME"
            echo "运行号 : $GITHUB_RUN_NUMBER   run_id=$GITHUB_RUN_ID"
            echo "时间   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "----- 源码目录状态 -----"
            ls -ld "$OPENWRT_PATH" 2>&1 || true
            [ -d "$OPENWRT_PATH" ] && ls -l "$OPENWRT_PATH/scripts/feeds" 2>&1 || true
            [ -d "$OPENWRT_PATH" ] && head -1 "$OPENWRT_PATH/scripts/feeds" 2>&1 || true
            [ -d "$OPENWRT_PATH" ] && echo ".config 行数: $(wc -l < "$OPENWRT_PATH/.config" 2>/dev/null || echo NA)"
            echo
            echo "----- 关键工具 -----"
            for c in make gcc g++ perl patch gperf rsync unzip xz zstd ccache; do
              printf '%-8s %s\n' "$c" "$(command -v "$c" || echo MISSING)"
            done
            echo
            echo "----- 若编译步骤留下日志则附上尾部 -----"
            if [ -n "${COMPILE_LOG:-}" ] && [ -f "$COMPILE_LOG" ]; then
              tail -n 200 "$COMPILE_LOG"
            fi
          } > "$LOG" 2>&1

          # 注意：编译源码在 /mnt/openwrt（$GITHUB_WORKSPACE 之外），
          # 所以这里回到 workspace（本仓库）做 orphan 分支提交，只会带上这一个日志文件。
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diag-branch 2>/dev/null || git checkout diag-branch
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f "$LOG"
          git commit -m "diag: run #$GITHUB_RUN_NUMBER 失败诊断（$GITHUB_SHA）" || exit 0
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag-branch || true

  Release:
    runs-on: ubuntu-24.04
    needs: Build
    if: ${{ inputs.make_release }}
    permissions:
      contents: write
    steps:
      - name: Download Firmware Artifact(下载产物)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.artifact_name }}
          path: artifacts/firmware

      # Release 说明改由 bash 拼装：账号/密码、无线密码这些要根据
      # 「密码是否为空」「无线是否开启」做分支，用 YAML 内联表达式写会很难读。
      - name: Build Release Notes(生成 Release 说明)
        id: notes
        env:
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
          REPO_URL: ${{ inputs.repo_url }}
          REPO_BRANCH: ${{ inputs.repo_branch }}
          LAN_IP: ${{ inputs.lan_ip }}
          LAN_NETMASK: ${{ inputs.lan_netmask }}
          LAN_DNS: ${{ inputs.lan_dns }}
          HOSTNAME: ${{ inputs.hostname }}
          TIMEZONE: ${{ inputs.timezone }}
          ROOT_PASSWORD: ${{ inputs.root_password }}
          WIFI_ENABLED: ${{ inputs.wifi_enabled }}
          WIFI_SSID: ${{ inputs.wifi_ssid }}
          WIFI_PASSWORD: ${{ inputs.wifi_password }}
          WIFI_CHANNEL_2G: ${{ inputs.wifi_channel_2g }}
          WIFI_HTMODE_2G: ${{ inputs.wifi_htmode_2g }}
          WIFI_CHANNEL_5G: ${{ inputs.wifi_channel_5g }}
          WIFI_HTMODE_5G: ${{ inputs.wifi_htmode_5g }}
          FIRMWARE_TAG: ${{ needs.Build.outputs.firmware_tag }}
          KERNEL_VERSION: ${{ needs.Build.outputs.version_kernel }}
          VERSION_INFO: ${{ needs.Build.outputs.version_info }}
        run: |
          # 「密码是否为空」「无线是否开启」这两个分支直接在写入前判断，
          # 生成完再回头 sed 替换既难读又容易漏，所以按段落增量追加。
          NOTES=release-notes.md
          : > "$NOTES"

          # ---------- 登录凭据 ----------
          cat >> "$NOTES" <<MD
          ### 🔐 登录凭据

          | 项目 | 值 |
          | :--- | :--- |
          | 登录账号 | **\`root\`** |
          MD
          if [ -n "$ROOT_PASSWORD" ]; then
            echo "| 登录密码 | **\`${ROOT_PASSWORD}\`** |" >> "$NOTES"
          else
            echo "| 登录密码 | **未设置**（开机无密码，登录后请立即设置） |" >> "$NOTES"
          fi
          cat >> "$NOTES" <<MD

          > ⚠️ 以上为出厂默认凭据，且本仓库是公开仓库 —— **刷机完成后请第一时间登录修改密码**。

          MD

          # ---------- 无线 ----------
          cat >> "$NOTES" <<MD
          ### 📶 无线

          | 项目 | 值 |
          | :--- | :--- |
          MD
          if [ "$WIFI_ENABLED" = "on" ]; then
            cat >> "$NOTES" <<MD
          | 无线状态 | **默认开启** |
          | 2.4G SSID | **\`${WIFI_SSID}\`** |
          | 5G SSID | **\`${WIFI_SSID}_5G\`** |
          | 无线密码 | **\`${WIFI_PASSWORD}\`** |
          | 2.4G 信道 | ch${WIFI_CHANNEL_2G} / ${WIFI_HTMODE_2G} |
          | 5G 信道 | ch${WIFI_CHANNEL_5G} / ${WIFI_HTMODE_5G} |
          MD
          else
            cat >> "$NOTES" <<MD
          | 无线状态 | **默认关闭（不广播）** |
          | 如何启用 | LuCI → 网络 → 无线 → 启用，再自行设定 SSID 与密码 |
          MD
          fi
          echo >> "$NOTES"

          # ---------- 其余固定段落 ----------
          cat >> "$NOTES" <<MD
          ### 🌐 网络初始状态

          - 管理地址：**${LAN_IP}**（掩码 ${LAN_NETMASK}，DNS ${LAN_DNS}）
          - 主机名：${HOSTNAME}　时区：${TIMEZONE}

          ### 🧊 版本

          - Release 标签：\`${FIRMWARE_TAG}\`
          - 内核：**${KERNEL_VERSION}**
          - 源码最后一次提交：${VERSION_INFO}

          ### 📒 固件信息

          - ${RELEASE_SUMMARY}
          - 固件源码：${REPO_URL}
          - 源码分支：${REPO_BRANCH}
          - 设备：京东云 AX1800 Pro 亚瑟（jdcloud_re-ss-01 / IPQ6000）

          ### 💾 刷机对照

          - \`*-squashfs-sysupgrade.bin\` → 网页「系统→备份/升级」直接刷（已有 OpenWrt 时首选）
          - \`*-squashfs-factory.bin\` → U-Boot 首刷 / 跨固件平台刷
          - \`*-squashfs-recovery.bin\` → 救砖
          - 刷前确认 \`mmcblk0p18\` 为 2G 大分区布局
          MD

          echo "body_file=$PWD/$NOTES" >> "$GITHUB_OUTPUT"
          echo "----- Release 说明预览 -----"
          cat release-notes.md

      - name: Upload Firmware To Release(发布 Release)
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.Build.outputs.firmware_tag }}
          tag: ${{ needs.Build.outputs.firmware_tag }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
          token: ${{ github.token }}
          artifacts: artifacts/firmware/*
          bodyFile: ${{ steps.notes.outputs.body_file }}

  Cleanup:
    runs-on: ubuntu-24.04
    needs:
      - Build
      - Release
    if: ${{ always() && needs.Build.result == 'success' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete Old Cache(清理旧缓存)
        env:
          GH_TOKEN: ${{ github.token }}
          CCACHE_KEY: ${{ needs.Build.outputs.ccache_key }}
          STAGING_KEY: ${{ needs.Build.outputs.staging_key }}
        run: |
          # 前缀取到 artifact 一层：openwrt-Linux-IPQ60XX-
          #   这样才能命中「旧源码提交」（<hash> 不同）留下的缓存。
          #
          # 关键：必须【同时】排除当次的 ccache 与 staging 两个 key。
          #   这两个 key 共享同一前缀，旧写法在循环里只排除了当前的那个 key，
          #   于是清 ccache 时把本次刚存的 staging 删掉、清 staging 时又把本次
          #   ccache 删掉 —— 每次跑完缓存归零，二次编译永远退化成全量冷编译。
          prefix="${CCACHE_KEY%-*}"; prefix="${prefix%-*}-"
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json id,key 2>/dev/null \
            | jq -r --arg c "$CCACHE_KEY" --arg s "$STAGING_KEY" \
                  '.[] | select(.key != $c and .key != $s) | .id' \
            | while read -r cid; do
                  [ -n "$cid" ] || continue
                  gh cache delete --repo "$GITHUB_REPOSITORY" "$cid" || true
                done

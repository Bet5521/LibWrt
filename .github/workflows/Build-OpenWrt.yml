# =============================================================
#  公共编译模板（架构参照 laipeng668/openwrt-ci-roc，即 LibWrt 作者本人的云编译项目）
#  要点：
#   1) 源码 git clone 到 /mnt/openwrt，不用 actions/checkout 拉大仓库
#   2) 依赖用 LibWrt README 的官方完整清单
#   3) make download 失败重试 3 次（make download 报错是正常现象，见上游 issue #153）
#   4) make -j$(nproc) 失败自动降级 make -j1 V=s（拿到真正报错行）
#   5) ccache + staging_dir 缓存，二次编译从 1~2 小时降到 10~20 分钟
# =============================================================
name: Build-OpenWrt

on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      config_file:
        required: true
        type: string
      firmware_tag:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      manifest_file:
        required: false
        type: string
        default: ''
      release_summary:
        required: false
        type: string
        default: '京东云 AX1800 Pro 亚瑟 · 精简满血 NSS'
      make_release:
        required: false
        type: boolean
        default: true
      # ==================== 按需自定义（全部可选，都有默认值）====================
      # 说明：这一组输入让"每次点 Run workflow"都能改 LAN 地址 / 无线初始状态 / 组件。
      #       类型统一用 string（而不是 boolean），是为了让 push / schedule 这类
      #       没有 inputs 上下文的触发方式能用 `|| '默认值'` 兜底，避免被空值覆盖。
      # ---------- LAN / 系统 ----------
      lan_ip:
        required: false
        type: string
        default: '192.168.1.1'
      lan_netmask:
        required: false
        type: string
        default: '255.255.255.0'
      lan_dns:
        required: false
        type: string
        default: '223.5.5.5'
      hostname:
        required: false
        type: string
        default: 'LibWrt'
      timezone:
        required: false
        type: string
        default: 'Asia/Shanghai'
      root_password:
        required: false
        type: string
        default: ''
      # ---------- 无线 ----------
      wifi_enabled:
        required: false
        type: string
        default: 'on'
      wifi_ssid:
        required: false
        type: string
        default: 'JDC-AX1800Pro'
      wifi_password:
        required: false
        type: string
        default: 'password12345'
      wifi_country:
        required: false
        type: string
        default: 'CN'
      wifi_channel_2g:
        required: false
        type: string
        default: '6'
      wifi_htmode_2g:
        required: false
        type: string
        default: 'HE20'
      wifi_channel_5g:
        required: false
        type: string
        default: '36'
      wifi_htmode_5g:
        required: false
        type: string
        default: 'HE80'
      # ---------- 组件 / 功能 ----------
      extra_packages:
        required: false
        type: string
        default: ''
      remove_packages:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      repo_url:
        description: '源码仓库'
        required: true
        default: 'https://github.com/Bet5521/LibWrt.git'
      repo_branch:
        description: '源码分支'
        required: true
        default: '25.12-nss'
      config_file:
        description: 'config 文件路径'
        required: true
        default: 'configs/IPQ60XX.config'
      firmware_tag:
        description: 'Release tag'
        required: true
        default: 'IPQ60XX'
      artifact_prefix:
        description: '产物前缀'
        required: true
        default: 'IPQ60XX'
      manifest_file:
        description: 'manifest 文件名（可留空）'
        required: false
        default: ''
      release_summary:
        description: 'Release 说明'
        required: false
        default: '京东云 AX1800 Pro 亚瑟 · 精简满血 NSS'
      make_release:
        description: '是否发布 Release'
        required: false
        type: boolean
        default: true
      # ---------- LAN / 系统 ----------
      lan_ip:
        description: 'LAN IP（路由器管理地址）'
        required: false
        default: '192.168.1.1'
      lan_netmask:
        description: 'LAN 子网掩码'
        required: false
        default: '255.255.255.0'
      lan_dns:
        description: 'LAN 下发的 DNS'
        required: false
        default: '223.5.5.5'
      hostname:
        description: '主机名'
        required: false
        default: 'LibWrt'
      timezone:
        description: '时区'
        required: false
        default: 'Asia/Shanghai'
      root_password:
        description: 'root 密码（留空=无密码）'
        required: false
        default: ''
      # ---------- 无线 ----------
      wifi_enabled:
        description: '无线初始状态'
        required: false
        type: choice
        options:
          - 'on'
          - 'off'
        default: 'on'
      wifi_ssid:
        description: 'WiFi 名称（5G 会自动加 _5G 后缀）'
        required: false
        default: 'JDC-AX1800Pro'
      wifi_password:
        description: 'WiFi 密码（至少 8 位）'
        required: false
        default: 'password12345'
      wifi_country:
        description: '无线国家码'
        required: false
        default: 'CN'
      wifi_channel_2g:
        description: '2.4G 信道'
        required: false
        default: '6'
      wifi_htmode_2g:
        description: '2.4G 频宽/模式'
        required: false
        type: choice
        options:
          - 'HE20'
          - 'HE40'
          - 'HT20'
          - 'HT40'
        default: 'HE20'
      wifi_channel_5g:
        description: '5G 信道（36/149 非 DFS）'
        required: false
        default: '36'
      wifi_htmode_5g:
        description: '5G 频宽/模式'
        required: false
        type: choice
        options:
          - 'HE80'
          - 'HE160'
          - 'HE40'
          - 'VHT80'
        default: 'HE80'
      # ---------- 组件 / 功能 ----------
      extra_packages:
        description: '额外加入的包（空格/逗号分隔，可多行）'
        required: false
        default: ''
      remove_packages:
        description: '要移除的包（空格/逗号分隔，可多行）'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  OPENWRT_PATH: /mnt/openwrt
  CONFIG_DIR: configs
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_name: ${{ steps.vars.outputs.artifact_name }}
      version_kernel: ${{ steps.source.outputs.version_kernel }}
      version_info: ${{ steps.source.outputs.version_info }}
      ccache_key: ${{ steps.vars.outputs.ccache_key }}
      staging_key: ${{ steps.vars.outputs.staging_key }}
    permissions:
      contents: read
    steps:
      # ---------- 0 检出本仓库（只拉本仓库，很小）----------
      - name: Checkout(检出本仓库)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Server Info(服务器信息)
        run: |
          echo "--- CPU ---"; grep -c ^processor /proc/cpuinfo
          echo "--- 内存 ---"; free -h
          echo "--- 磁盘 ---"; df -hT /

      # ---------- 1 依赖（LibWrt README 官方清单）----------
      - name: Initialization Environment(安装依赖)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            zstd lz4 liblzma-dev
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          echo "--- 自检 ---"
          for c in make gcc g++ perl patch gperf rsync unzip xz zstd; do
            printf '%-10s %s\n' "$c" "$(command -v "$c" || echo MISSING)"
          done

      # ---------- 2 clone 源码到 /mnt/openwrt ----------
      - name: Clone Source Code(克隆源码)
        id: source
        env:
          REPO_URL: ${{ inputs.repo_url }}
          REPO_BRANCH: ${{ inputs.repo_branch }}
        run: |
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
          for attempt in 1 2 3; do
            if git clone --depth 1 -b "$REPO_BRANCH" --single-branch "$REPO_URL" "$OPENWRT_PATH"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::源码 clone 失败（已重试 3 次）"
              exit 1
            fi
            echo "::warning::clone 失败，第 $attempt 次重试"
            sudo rm -rf "$OPENWRT_PATH"; sudo mkdir -p "$OPENWRT_PATH"
            sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
            sleep $((attempt * 5))
          done
          cd "$OPENWRT_PATH"
          ls -l scripts/feeds
          head -1 scripts/feeds
          VERSION_INFO="$(git show -s --date=short --format='时间: %cd<br/>内容: %s<br/>hash: %H')"
          {
            echo 'version_info<<EOF'
            echo "$VERSION_INFO"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          KERNEL_VER="$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-* 2>/dev/null | head -n1 || true)"
          echo "version_kernel=${KERNEL_VER:-unknown}" >> "$GITHUB_OUTPUT"

      # ---------- 3 更新 feeds ----------
      - name: Update Feeds(更新 feeds)
        run: |
          cd "$OPENWRT_PATH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------- 4 生成变量（缓存 key / 产物名）----------
      - name: Generate Variables(生成变量)
        id: vars
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          cd "$OPENWRT_PATH"
          SONAME="${REPO_URL##*/}"
          ARTIFACT_NAME="firmware-${ARTIFACT_PREFIX}"
          HASH="$(git rev-parse HEAD)"; HASH="${HASH:0:7}"
          CACHE_PREFIX="openwrt-${RUNNER_OS}-${ARTIFACT_PREFIX}-${HASH}"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "ccache_key=${CACHE_PREFIX}-ccache"
            echo "staging_key=${CACHE_PREFIX}-staging"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
          } >> "$GITHUB_ENV"

      - name: Cache Ccache(缓存 ccache)
        uses: actions/cache@v4
        with:
          key: ${{ steps.vars.outputs.ccache_key }}
          restore-keys: |
            openwrt-${{ runner.os }}-${{ inputs.artifact_prefix }}-ccache
          path: ${{ env.OPENWRT_PATH }}/.ccache

      - name: Cache Staging Directory(缓存工具链)
        uses: actions/cache@v4
        with:
          key: ${{ steps.vars.outputs.staging_key }}
          restore-keys: |
            openwrt-${{ runner.os }}-${{ inputs.artifact_prefix }}-staging
          path: ${{ env.OPENWRT_PATH }}/staging_dir

      # ---------- 5 应用 config ----------
      - name: Apply Config(应用 config)
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          cd "$OPENWRT_PATH"
          CONFIG_SRC="$GITHUB_WORKSPACE/$CONFIG_FILE"
          if [ ! -f "$CONFIG_SRC" ]; then
            echo "::error::找不到配置文件 $CONFIG_SRC"
            ls -R "$GITHUB_WORKSPACE/$CONFIG_DIR" || true
            exit 1
          fi
          cp "$CONFIG_SRC" .config
          make defconfig

          echo "--- 剔除本分支不存在的符号 ---"
          grep -E '^CONFIG_[A-Z0-9_]+=y$' .config | sort -u | while read -r line; do
            k="${line%%=*}"
            if grep -q "^# ${k} is not set" .config; then
              echo "[drop] ${k}"
              sed -i "\|^${k}=y\$|d" .config
            fi
          done
          make defconfig

          echo "--- 关键项检查 ---"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET)|DEVICE_jdcloud_re-ss-01' .config || true
          grep -E '^CONFIG_PACKAGE_(kmod-qca-nss|nss-firmware|ath11k-firmware)' .config | head -12 || true

      # ---------- 5.5 组件自定义（加包 / 去包，可选）----------
      - name: Apply Package Selection(组件自定义)
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          REMOVE_PACKAGES: ${{ inputs.remove_packages }}
        run: |
          cd "$OPENWRT_PATH"
          norm() {
            printf '%s' "${1:-}" \
              | sed 's/，/\n/g' \
              | tr ',' '\n' | tr '\t' '\n' | tr ' ' '\n' \
              | sed 's/^CONFIG_PACKAGE_//' | sed '/^$/d'
          }
          ADD="$(norm "$EXTRA_PACKAGES")"
          DEL="$(norm "$REMOVE_PACKAGES")"

          if [ -z "$ADD" ] && [ -z "$DEL" ]; then
            echo "未指定额外组件，沿用 config 文件默认值"
            exit 0
          fi

          while read -r p; do
            [ -n "$p" ] || continue
            sed -i "\|^CONFIG_PACKAGE_${p}=|d" .config
            echo "CONFIG_PACKAGE_${p}=y" >> .config
            echo "[+包] $p"
          done <<< "$ADD"

          while read -r p; do
            [ -n "$p" ] || continue
            sed -i "\|^CONFIG_PACKAGE_${p}=|d" .config
            echo "CONFIG_PACKAGE_${p}=n" >> .config
            echo "[-包] $p"
          done <<< "$DEL"

          make defconfig

          echo "--- 校验生效情况 ---"
          for p in $ADD; do
            [ -n "$p" ] || continue
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "[OK]   $p"
            else
              echo "::warning::包未生效（名字写错或本分支没有）: $p"
            fi
          done
          for p in $DEL; do
            [ -n "$p" ] || continue
            if grep -qE "^CONFIG_PACKAGE_${p}=n$|^# CONFIG_PACKAGE_${p} is not set$" .config; then
              echo "[已关] $p"
            else
              echo "::warning::未能关闭（可能被其他包依赖）: $p"
            fi
          done
          echo "（未生效的包只警告，不中断编译）"

      # ---------- 6 初始状态自定义：LAN / 无线 / 主机名 / 密码 ----------
      - name: Load Custom Configuration(加载自定义配置)
        env:
          DIY_LAN_IP: ${{ inputs.lan_ip }}
          DIY_LAN_NETMASK: ${{ inputs.lan_netmask }}
          DIY_LAN_DNS: ${{ inputs.lan_dns }}
          DIY_HOSTNAME: ${{ inputs.hostname }}
          DIY_TIMEZONE: ${{ inputs.timezone }}
          DIY_ROOT_PASSWORD: ${{ inputs.root_password }}
          DIY_WIFI_ENABLED: ${{ inputs.wifi_enabled }}
          DIY_WIFI_SSID: ${{ inputs.wifi_ssid }}
          DIY_WIFI_PASSWORD: ${{ inputs.wifi_password }}
          DIY_WIFI_COUNTRY: ${{ inputs.wifi_country }}
          DIY_WIFI_CHANNEL_2G: ${{ inputs.wifi_channel_2g }}
          DIY_WIFI_HTMODE_2G: ${{ inputs.wifi_htmode_2g }}
          DIY_WIFI_CHANNEL_5G: ${{ inputs.wifi_channel_5g }}
          DIY_WIFI_HTMODE_5G: ${{ inputs.wifi_htmode_5g }}
        run: |
          cd "$OPENWRT_PATH"
          if [ -f "$GITHUB_WORKSPACE/ci/diy.sh" ]; then
            bash "$GITHUB_WORKSPACE/ci/diy.sh" || echo "::warning::diy.sh 非 0 退出，继续"
          else
            echo '无 ci/diy.sh，跳过'
          fi
          echo "--- 自定义结果核对 ---"
          echo "[wireless]"
          sed -n '1,30p' "$OPENWRT_PATH/files/etc/config/wireless" 2>/dev/null || echo '(未生成 wireless 自定义)'
          echo "[uci-defaults 99-diy-custom]"
          sed -n '1,45p' "$OPENWRT_PATH/files/etc/uci-defaults/99-diy-custom" 2>/dev/null || echo '(未生成 99-diy-custom)'
          echo "[crontabs]"
          cat "$OPENWRT_PATH/files/etc/crontabs/root" 2>/dev/null || echo '(未生成 crontab)'

      # ---------- 7 下载 dl（重试 3 次；报错属正常，见上游 issue #153）----------
      - name: Download DL Package(预下载源码包)
        run: |
          cd "$OPENWRT_PATH"
          echo "::notice::预下载源码包首次约需 10~25 分钟（有缓存时 1~3 分钟）。此步无实时输出属正常，请勿取消。"
          mkdir -p dl
          # 后台每 45 秒报一次体积，避免看起来像卡死
          ( while :; do sleep 45; echo "[dl $(date +%H:%M:%S)] $(du -sh dl 2>/dev/null | cut -f1) / 待下 $(find dl -type f -size -1024c 2>/dev/null | wc -l) 个残片"; done ) &
          DL_PID=$!
          for attempt in 1 2 3; do
            if make download -j"$(nproc)"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::make download 连续 3 次未全成功，仍继续编译（上游说明属正常）"
              break
            fi
            echo "::warning::make download 第 $attempt 次未完成，清理残缺文件后重试"
            find dl -type f -size -1024c -print -delete 2>/dev/null || true
            sleep $((attempt * 5))
          done
          kill "$DL_PID" 2>/dev/null || true
          echo "[dl] 预下载完成，体积 $(du -sh dl 2>/dev/null | cut -f1)"
          df -hT "$OPENWRT_PATH" | tail -1

      # ---------- 8 编译（多线程失败自动降级单线程详细日志）----------
      - name: Compile Firmware(开始编译)
        run: |
          cd "$OPENWRT_PATH"
          export COMPILE_LOG="$RUNNER_TEMP/compile.log"
          echo "COMPILE_LOG=$COMPILE_LOG" >> "$GITHUB_ENV"
          echo "::notice::编译首次约需 40~90 分钟（有 ccache/staging 缓存时 10~25 分钟）。"
          echo "$(nproc) 线程编译"
          # 先并行编译（快）；失败则降级单线程 + V=s 拿到真正的报错行。
          # 两路输出都 tee 进日志，供失败诊断步骤回写。
          make -j"$(nproc)" BUILD_LOG=1 2>&1 | tee -a "$COMPILE_LOG" || {
            echo "::warning::并行编译失败，降级 make -j1 V=s 以定位报错"
            make -j1 V=s 2>&1 | tee -a "$COMPILE_LOG"
          }
          echo "[compile] 结束，日志 $(wc -l < "$COMPILE_LOG" 2>/dev/null || echo '?') 行"

      # ---------- 9 整理产物 ----------
      - name: Organize Files(整理产物)
        id: organize
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          cd "$OPENWRT_PATH"/bin/targets/*/*
          echo "--- 产物清单 ---"
          ls -lh
          cp "$OPENWRT_PATH/.config" "$ARTIFACT_PREFIX.config"
          [ -f config.buildinfo ] && mv config.buildinfo "$ARTIFACT_PREFIX.config.buildinfo" || true
          for f in *.manifest; do [ -e "$f" ] && mv "$f" "$ARTIFACT_PREFIX.manifest"; done
          rm -rf packages feeds.buildinfo version.buildinfo sha256sums profiles.json || true
          echo "firmware_path=$PWD" >> "$GITHUB_OUTPUT"

      - name: Upload Firmware Artifact(上传产物)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.organize.outputs.firmware_path }}/*
          if-no-files-found: error
          retention-days: 30

      # ---------- 失败诊断回写 ----------
      # 目的：把"哪一步、哪条命令、什么错误"写进仓库的一个独立分支，
      # 这样即使没有 token（读不到 Actions 日志），也能直接 clone 那个分支看原因。
      - name: Write Diagnostics On Failure(失败时回写诊断)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          LOG="workflow-diag.txt"
          {
            echo "===== LibWrt 云编译失败诊断 ====="
            echo "仓库   : $GITHUB_REPOSITORY"
            echo "分支   : ${{ inputs.repo_branch }}"
            echo "提交   : $GITHUB_SHA"
            echo "事件   : $GITHUB_EVENT_NAME"
            echo "运行号 : $GITHUB_RUN_NUMBER   run_id=$GITHUB_RUN_ID"
            echo "时间   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "----- 源码目录状态 -----"
            ls -ld "$OPENWRT_PATH" 2>&1 || true
            [ -d "$OPENWRT_PATH" ] && ls -l "$OPENWRT_PATH/scripts/feeds" 2>&1 || true
            [ -d "$OPENWRT_PATH" ] && head -1 "$OPENWRT_PATH/scripts/feeds" 2>&1 || true
            [ -d "$OPENWRT_PATH" ] && echo ".config 行数: $(wc -l < "$OPENWRT_PATH/.config" 2>/dev/null || echo NA)"
            echo
            echo "----- 关键工具 -----"
            for c in make gcc g++ perl patch gperf rsync unzip xz zstd ccache; do
              printf '%-8s %s\n' "$c" "$(command -v "$c" || echo MISSING)"
            done
            echo
            echo "----- 若编译步骤留下日志则附上尾部 -----"
            if [ -n "${COMPILE_LOG:-}" ] && [ -f "$COMPILE_LOG" ]; then
              tail -n 200 "$COMPILE_LOG"
            fi
          } > "$LOG" 2>&1

          # 注意：编译源码在 /mnt/openwrt（$GITHUB_WORKSPACE 之外），
          # 所以这里回到 workspace（本仓库）做 orphan 分支提交，只会带上这一个日志文件。
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diag-branch 2>/dev/null || git checkout diag-branch
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f "$LOG"
          git commit -m "diag: run #$GITHUB_RUN_NUMBER 失败诊断（$GITHUB_SHA）" || exit 0
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag-branch || true

  Release:
    runs-on: ubuntu-24.04
    needs: Build
    if: ${{ inputs.make_release }}
    permissions:
      contents: write
    steps:
      - name: Download Firmware Artifact(下载产物)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.artifact_name }}
          path: artifacts/firmware

      - name: Upload Firmware To Release(发布 Release)
        uses: ncipollo/release-action@v1
        with:
          name: ${{ inputs.firmware_tag }}
          tag: ${{ inputs.firmware_tag }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
          token: ${{ github.token }}
          artifacts: artifacts/firmware/*
          body: |
            ### 📒 固件信息
            - ${{ inputs.release_summary }}
            - 固件源码：${{ inputs.repo_url }}
            - 源码分支：${{ inputs.repo_branch }}
            - 设备：京东云 AX1800 Pro 亚瑟（jdcloud_re-ss-01 / IPQ6000）
            ### 🌐 网络初始状态
            - 管理地址：**${{ inputs.lan_ip }}**（掩码 ${{ inputs.lan_netmask }}，DNS ${{ inputs.lan_dns }}）
            - 主机名：${{ inputs.hostname }}　时区：${{ inputs.timezone }}
            - 无线：**${{ inputs.wifi_enabled }}**　SSID：${{ inputs.wifi_ssid }} / ${{ inputs.wifi_ssid }}_5G
            - 无线信道：2.4G ch${{ inputs.wifi_channel_2g }} ${{ inputs.wifi_htmode_2g }} ｜ 5G ch${{ inputs.wifi_channel_5g }} ${{ inputs.wifi_htmode_5g }}
            ### 🧊 版本
            - 内核：**${{ needs.Build.outputs.version_kernel }}**
            - 源码最后一次提交：${{ needs.Build.outputs.version_info }}
            ### 💾 刷机对照
            - `*-squashfs-sysupgrade.bin` → 网页「系统→备份/升级」直接刷（已有 OpenWrt 时首选）
            - `*-squashfs-factory.bin` → U-Boot 首刷 / 跨固件平台刷
            - `*-squashfs-recovery.bin` → 救砖
            - 刷前确认 `mmcblk0p18` 为 2G 大分区布局

  Cleanup:
    runs-on: ubuntu-24.04
    needs:
      - Build
      - Release
    if: ${{ always() && needs.Build.result == 'success' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete Old Cache(清理旧缓存)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for key in "${{ needs.Build.outputs.ccache_key }}" "${{ needs.Build.outputs.staging_key }}"; do
            [ -n "$key" ] || continue
            prefix="${key%-*}"; prefix="${prefix%-*}-"
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json id,key,createdAt 2>/dev/null \
              | jq -r --arg k "$key" '.[] | select(.key != $k) | .id' \
              | while read -r cid; do
                  [ -n "$cid" ] || continue
                  gh cache delete --repo "$GITHUB_REPOSITORY" "$cid" || true
                done
          done

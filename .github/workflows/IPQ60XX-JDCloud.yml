# =============================================================
#  京东云 AX1800 Pro 亚瑟（jdcloud_re-ss-01 / IPQ6000）云编译入口
#  架构参照 LibWrt 作者本人的 laipeng668/openwrt-ci-roc
#
#  用法：Actions → 左栏 IPQ60XX-JDCloud-AX1800Pro → Run workflow
#        表单里可直接改 LAN 地址 / 无线初始状态 / 组件，全部留空即用默认值。
#
#  本分支（24.10-nss）编译的是 OpenWrt 24.10 基线 + NSS 加速 + ath11k 无线，
#  源码取自 qosmio/openwrt-ipq 的 24.10-nss 分支（IPQ60xx NSS 正统来源，自带正确 feeds）。
#
#  注意：本 workflow 仅支持手动触发（workflow_dispatch），无 push / schedule。
#       所有 with: 都写成 `${{ inputs.x || '默认值' }}`，表单留空时用默认值兜底。
# =============================================================
name: IPQ60XX-JDCloud-AX1800Pro

on:
  # 手动触发：仓库页面 Actions → IPQ60XX-JDCloud-AX1800Pro → Run workflow
  workflow_dispatch:
    inputs:
      # ==================== 固件档位 ====================
      config_file:
        description: '固件档位（配置文件）'
        type: choice
        options:
          - configs/IPQ60XX.config
          - configs/IPQ60XX-minimal.config
          - configs/IPQ60XX-full.config
          - configs/NoWiFi.config
        default: configs/IPQ60XX.config

      # ==================== LAN / 系统 ====================
      lan_ip:
        description: 'LAN IP（路由器管理地址，如 192.168.10.1）'
        required: false
        default: '192.168.10.1'
      lan_netmask:
        description: 'LAN 子网掩码'
        required: false
        default: '255.255.255.0'
      lan_dns:
        description: '路由器上游 DNS（DNS 转发）。客户端默认由路由器做 DNS，改这里即可全局改 DNS'
        required: false
        default: '223.5.5.5'
      hostname:
        description: '主机名'
        required: false
        default: 'JDC-AX1800Pro'
      timezone:
        description: '时区'
        required: false
        default: 'Asia/Shanghai'
      root_password:
        description: 'root/LuCI 密码（留空=无密码）'
        required: false
        default: ''

      # ==================== 无线初始状态 ====================
      wifi_enabled:
        description: '无线初始状态（off = 开机不启用，之后可在 LuCI 里开）'
        type: choice
        options:
          - 'on'
          - 'off'
        default: 'on'
      wifi_ssid:
        description: 'WiFi 名称（5G 会自动加 _5G 后缀）'
        required: false
        default: 'JDC-AX1800Pro'
      wifi_password:
        description: 'WiFi 密码（至少 8 位）'
        required: false
        default: 'password12345'
      wifi_country:
        description: '无线国家码'
        required: false
        default: 'CN'
      wifi_channel_2g:
        description: '2.4G 信道（1/6/11 互不干扰）'
        required: false
        default: '6'
      wifi_htmode_2g:
        description: '2.4G 频宽'
        type: choice
        options:
          - 'HE20'
          - 'HE40'
          - 'HT20'
          - 'HT40'
        default: 'HE20'
      wifi_channel_5g:
        description: '5G 信道（36-48 / 149-165 为非 DFS）'
        required: false
        default: '36'
      wifi_htmode_5g:
        description: '5G 频宽'
        type: choice
        options:
          - 'HE80'
          - 'HE160'
          - 'HE40'
          - 'VHT80'
        default: 'HE80'

      # ==================== 组件 / 功能 ====================
      extra_packages:
        description: '额外加入的包（空格或逗号分隔，可多行）'
        required: false
        default: ''
      remove_packages:
        description: '要移除的包（空格或逗号分隔，可多行）'
        required: false
        default: ''
      extra_feeds:
        description: '自定义 feed 源（每行一个：<name> <url>[;branch]，留空=只用源码默认 feeds）'
        required: false
        default: ''

      # ==================== 发布 ====================
      make_release:
        description: '编译成功后发布 Release'
        type: boolean
        default: true

permissions:
  # 必须是 write：Build 失败时要往 diag-branch 回写诊断日志，
  # Release 阶段也要建 Release / 传固件。之前写 read 导致诊断永远推不上去，
  # 失败只能靠猜（日志接口需要管理员权限，外部读不到）。
  # issues:write —— 可复用工作流申请写权限的上限由【调用方】决定，
  #                 这里不给，被调用方申请 issues:write 会直接 startup_failure。
  contents: write
  issues: write
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
      # 被调用方可申请的权限上限由这里决定；少了 issues:write，
      # Build-OpenWrt.yml 里申请 issues:write 会让整条 workflow 起不来。
      issues: write
    with:
      # ---------- 基础 ----------
      # 24.10 基线：源码直接拉 qosmio 的 IPQ60xx NSS 分支（自带正确的 NSS/wireless feeds）
      # configs/ 与 ci/diy.sh 仍用本仓库（24.10-nss 分支）这一份，固件定制逻辑保持一致。
      repo_url: https://github.com/qosmio/openwrt-ipq.git
      repo_branch: 24.10-nss
      config_file: ${{ inputs.config_file || 'configs/IPQ60XX.config' }}
      # firmware_tag 不再由这里指定：模板会用
      #   <主机名>_<内核版本>_<config 名称>_<构建日期>
      # 自动拼出（内核版本只有 clone 完源码才知道，表单里填不出来）。
      artifact_prefix: IPQ60XX
      make_release: ${{ github.event_name != 'workflow_dispatch' || inputs.make_release }}

      # ---------- LAN / 系统 ----------
      lan_ip: ${{ inputs.lan_ip || '192.168.10.1' }}
      lan_netmask: ${{ inputs.lan_netmask || '255.255.255.0' }}
      lan_dns: ${{ inputs.lan_dns || '223.5.5.5' }}
      hostname: ${{ inputs.hostname || 'JDC-AX1800Pro' }}
      timezone: ${{ inputs.timezone || 'Asia/Shanghai' }}
      root_password: ${{ inputs.root_password || '' }}

      # ---------- 无线 ----------
      wifi_enabled: ${{ inputs.wifi_enabled || 'on' }}
      wifi_ssid: ${{ inputs.wifi_ssid || 'JDC-AX1800Pro' }}
      wifi_password: ${{ inputs.wifi_password || 'password12345' }}
      wifi_country: ${{ inputs.wifi_country || 'CN' }}
      wifi_channel_2g: ${{ inputs.wifi_channel_2g || '6' }}
      wifi_htmode_2g: ${{ inputs.wifi_htmode_2g || 'HE20' }}
      wifi_channel_5g: ${{ inputs.wifi_channel_5g || '36' }}
      wifi_htmode_5g: ${{ inputs.wifi_htmode_5g || 'HE80' }}

      # ---------- 组件 ----------
      extra_packages: ${{ inputs.extra_packages || '' }}
      remove_packages: ${{ inputs.remove_packages || '' }}
      # 自定义 feed 源：留空则只用源码自带 feeds.conf.default
      extra_feeds: ${{ inputs.extra_feeds || '' }}

      # ---------- Release 说明 ----------
      release_summary: >-
        京东云 AX1800 Pro 亚瑟（RE-SS-01 / IPQ6000，512MB RAM）。
        精简满血 NSS：kmod-qca-nss-{drv,ecm,crypto,dp} + nss-firmware-ipq60xx；
        ath11k 无线（ath11k-firmware-ipq6018 + ipq-wifi-jdcloud_re-ss-01）。

name: Setup Repo(一次性配置 About 与 Pages)

# 这个工作流只该手动跑一两次：把仓库 About（描述 / 主页 / Topics）改成实际内容，
# 并启用 GitHub Pages（fork 仓库不会继承上游的 Pages 设置，必须显式开一次）。
# 之后网页部署由 Pages.yml 负责，本文件可以保留也可以删除。

on:
  workflow_dispatch:

# GITHUB_TOKEN 默认拿不到这些权限，必须在这里显式声明：
#   administration: write  → PATCH /repos（About）与 PUT /topics
#   pages: write           → POST /pages（启用 Pages）
permissions:
  contents: read
  administration: write
  pages: write

concurrency:
  group: setup-repo
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Update About(更新描述 / 主页 / Topics)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DESC='京东云 AX1800 Pro（IPQ6000）OpenWrt 固件：NSS 满血卸载｜24.10-nss / 25.12-nss 双分支云编译｜网页版功能选择 + 自定义 feed 校验｜内置 Lucky'
          HOMEPAGE='https://bet5521.github.io/LibWrt/'
          TOPICS='openwrt,nss,ipq6000,ipq60xx,jdcloud,ax1800pro,nss-offload,github-actions,lucky'

          echo "--- PATCH /repos（description + homepage）---"
          BODY=$(jq -n --arg d "$DESC" --arg h "$HOMEPAGE" '{description:$d, homepage:$h}')
          CODE=$(curl -s -o /tmp/patch.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d "$BODY")
          echo "HTTP $CODE"; jq '{description, homepage}' /tmp/patch.json 2>/dev/null || cat /tmp/patch.json
          [ "$CODE" = "200" ] || { echo "::error::更新 About 失败"; exit 1; }

          echo "--- PUT /topics ---"
          CODE=$(curl -s -o /tmp/topics.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/topics" \
            -d "{\"names\":$(printf '%s' "$TOPICS" | jq -R 'split(",")')}")
          echo "HTTP $CODE"; cat /tmp/topics.json 2>/dev/null
          [ "$CODE" = "200" ] || { echo "::error::更新 Topics 失败"; exit 1; }

      - name: Enable Pages(启用 GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -s -o /tmp/pages_get.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "GET /pages -> HTTP $CODE"

          if [ "$CODE" = "200" ]; then
            echo "Pages 已启用（build_type=$(jq -r .build_type /tmp/pages_get.json)），无需再开"
            exit 0
          fi
          if [ "$CODE" != "404" ]; then
            echo "::error::查询 Pages 状态异常"; cat /tmp/pages_get.json; exit 1
          fi

          echo "--- POST /pages（build_type=workflow）---"
          CODE=$(curl -s -o /tmp/pages_post.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "HTTP $CODE"; cat /tmp/pages_post.json 2>/dev/null
          if [ "$CODE" = "201" ]; then
            echo "✅ Pages 已启用，源 = GitHub Actions"
          elif [ "$CODE" = "409" ]; then
            echo "Pages 已存在（409），视为成功"
          else
            echo "::error::启用 Pages 失败（HTTP $CODE）"
            exit 1
          fi

      - name: Verify(复核)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- 仓库 About ---"
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | jq '{description, homepage, has_pages, topics}'

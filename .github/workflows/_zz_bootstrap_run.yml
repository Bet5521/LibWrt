name: _zz_bootstrap_run
on:
  push:
    branches: [24.10-nss]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger real build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          code=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/IPQ60XX-JDCloud.yml/dispatches" \
            -d '{"ref":"24.10-nss","inputs":{"config_file":"configs/IPQ60XX.config","lan_ip":"192.168.10.1","lan_dns":"223.5.5.5","wifi_ssid":"JDC-AX1800Pro","wifi_password":"password12345"}}')
          echo "dispatch http=$code"
          cat /tmp/resp.txt
          echo
          [ "$code" = "204" ] || exit 1

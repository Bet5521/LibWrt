# =============================================================
#  单文件自包含版：LibWrt 25.12-nss 云编译（京东云 AX1800 Pro 亚瑟 · 精简满血 NSS）
#  目标仓库：https://github.com/Bet5521/LibWrt  （默认分支 25.12-nss）
#  用法：把本文件内容粘到仓库的 .github/workflows/build.yml（默认分支）
# =============================================================
name: LibWrt-NSS-亚瑟-云编译

on:
  workflow_dispatch:
    inputs:
      device_symbol:
        description: '目标设备 config 符号（留空=自动从源码探测 jdcloud_re-ss-01）'
        required: false
        default: ''
      nthreads:
        description: '编译并行线程数（内存小的 runner 填 4）'
        required: false
        default: '4'
      make_release:
        description: '编译成功后自动打 Release（填 false 则只出 Artifact）'
        required: false
        default: 'true'
  push:
    branches: [ '25.12-nss', 'main', 'master' ]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  SRC_BRANCH: 25.12-nss

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: '0 自检'
        run: |
          echo "GITHUB_WORKFLOW = ${GITHUB_WORKFLOW}"
          echo "GITHUB_REPOSITORY = ${GITHUB_REPOSITORY}"
          echo "GITHUB_REF = ${GITHUB_REF}"
          git log -1 --oneline | head -1
          ls -la .github/workflows/

      - name: '1 拉取源码（本仓库 25.12-nss）'
        uses: actions/checkout@v4
        with:
          ref: 25.12-nss
          fetch-depth: 0

      - name: '2 安装编译依赖'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ g++-multilib gettext git \
            libncurses5-dev libssl-dev libpython3-dev python3-pip rsync \
            ucode unzip zlib1g-dev file ccache cpio autoconf automake libtool \
            pkg-config kmod mtd-utils
          df -h / | tail -1
          echo "nproc = $(nproc)"
          free -g | head -2

      - name: '3 内嵌生成 config.minimal（精简 + 满血 NSS + ath11k）'
        run: |
          python3 - <<'PYEOF'
          cfg = r'''
          # ============================================================
          #  LibWrt 25.12-nss 云编译 —— 京东云亚瑟(jdcloud_re-ss-01) 精简 NSS 配置
          #  用法：cp config.minimal .config && make defconfig
          #  说明：这里面只写"关键项"，其余靠 make defconfig 从 Config.in 自动补齐。
          #        想加/减插件，直接改这里的 CONFIG_PACKAGE_xxx= 就行，然后重新跑 workflow。
          #        ＝y 编译进固件；＝m 做成模块（可 opkg/apk 后装）；删掉＝不装
          # ============================================================

          # ---------- 目标平台（会被 workflow 里的自动探测/覆盖）----------
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_ARCH="aarch64_cortex-a53"
          CONFIG_TARGET_BOARD="qualcommax"
          CONFIG_TARGET_SUBTARGET="ipq60xx"
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_UBI=y
          CONFIG_TARGET_KERNEL_PARAMS=y
          CONFIG_TARGET_KERNEL_VERSION="6.12"

          # ---------- 内核 / 驱动核心 ----------
          CONFIG_KERNEL_KALLSYMS=y
          CONFIG_KERNEL_KALLSYMS_UNCOMPRESSED=y
          CONFIG_KERNEL_XTAX=y
          CONFIG_KERNEL_MODULE_UNLOAD_TAINT_TRACKING=y
          CONFIG_KERNEL_DEBUG_FS=y
          CONFIG_KERNEL_LDFLAGS=""
          CONFIG_KERNEL_PROFILING=y

          # ---------- NSS 硬件卸载（满血 NSS 全家桶）----------
          CONFIG_PACKAGE_kmod-qca-nss-crypto=y
          CONFIG_PACKAGE_kmod-qca-nss-drv=y
          CONFIG_PACKAGE_kmod-qca-nss-ecm=y
          CONFIG_PACKAGE_kmod-qca-nss-dp=y
          CONFIG_PACKAGE_nss-firmware-ipq60xx=y
          CONFIG_PACKAGE_kmod-sqm=y
          CONFIG_PACKAGE_sqm-scripts-nss=y
          CONFIG_PACKAGE_kmod-pppoe=y
          CONFIG_PACKAGE_kmod-pppox=y
          CONFIG_PACKAGE_kmod-gre=y
          CONFIG_PACKAGE_kmod-ipip=y
          CONFIG_PACKAGE_kmod-vxlan=y
          CONFIG_PACKAGE_kmod-tunnel4=y
          CONFIG_PACKAGE_kmod-crypto-xts=y
          CONFIG_PACKAGE_kmod-crypto-aes=y
          CONFIG_PACKAGE_kmod-crypto-sha2=y
          CONFIG_PACKAGE_kmod-crypto-hash=y
          CONFIG_PACKAGE_kmod-crypto-cbc=y

          # ---------- 无线（ath11k / QCN5022+QCN5052）----------
          # 注意：LibWrt 25.12 的 ath11k-firmware 源码来自 laipeng668/ath11k-firmware-ddwrt，
          #       子包只有 default / ipq5018 / ipq5018-qcn6122 / ipq6018 / ipq8074 / qcn9074，
          #       **没有 qcn5052 / qcn5022 子包** → IPQ60xx 必须选 ipq6018 组（含 QCN5052/QCN5022 固件）。
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_kmod-ath11k-common=y
          CONFIG_PACKAGE_ath11k-firmware-ipq6018=y
          CONFIG_PACKAGE_ath11k-firmware-default=y
          # board-2.bin 覆盖件由 DEVICE_PACKAGES（ipq-wifi-jdcloud_re-ss-01）自动带出，别手写
          # 注意：wpad-* = 把 hostapd / wpa-supplicant 合成一个（二选一，别同时选）
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_kmod-mtph=y

          # ---------- 网络基础 ----------
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_dnsmasq-dhcpv6=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-ip6tables=y
          CONFIG_PACKAGE_kmod-ipt-offload=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y
          CONFIG_PACKAGE_iptables-notify=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_pppd=y
          CONFIG_PACKAGE_ppp-dialer=y
          CONFIG_PACKAGE_kmod-pppoe=y
          CONFIG_PACKAGE_kmod-pppox=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-theme-basic=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          # ---------- 常用小工具（精简，按需）----------
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_openssh-client-utils=y
          CONFIG_PACKAGE_openssh-server=y
          CONFIG_PACKAGE_coreutils-sort=y
          CONFIG_PACKAGE_coreutils-xxd=y
          CONFIG_PACKAGE_terminfo=y
          CONFIG_PACKAGE_libustream-mbedtls=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_watchdog=y

          # ---------- 精简：明确不要这些（防止 defconfig 拉进来）----------
          # CONFIG_PACKAGE_docker=n
          # CONFIG_PACKAGE_luci-app-dockerman=n
          # CONFIG_PACKAGE_luci-app-passwall=n
          # CONFIG_PACKAGE_luci-app-openclash=n
          # CONFIG_PACKAGE_luci-app-adguardhome=n
          # CONFIG_PACKAGE_luci-app-qbittorrent=n
          # CONFIG_PACKAGE_luci-app-samba4=n
          # CONFIG_PACKAGE_transmission-daemon=n
          # CONFIG_PACKAGE_luci-app-filetransfer=n
          '''
          data = cfg.strip('\n') + '\n'
          open('config.minimal', 'w').write(data)
          print('[config.minimal] lines =', len(data.splitlines()))
          PYEOF

      - name: '3.5 内嵌生成 diy.sh（默认主机名/时区/自愈脚本，默认全注释=不覆盖）'
        run: |
          python3 - <<'PYEOF'
          src = r'''
          #!/usr/bin/env bash
          # ============================================================
          #  diy.sh —— 编译前的"个性化"脚本（workflow 里第 ③.5 步调用）
          #  可改：默认 IP、主机名、root 密码、时区、开机自启脚本等
          #  注意：本脚本在 .config 生成之后、make 之前执行
          # ============================================================
          set -e

          # ---------- 1) 默认登录信息（编进固件的 defaults）----------
          sed -i 's/^config network\.loopback/ip           loopback/' package/base-files/etc/config/network 2>/dev/null || true

          uci -q set system.@system[0].hostname='JDC-AX1800Pro' 2>/dev/null || true
          uci -q set system.@system[0].timezone='Asia/Shanghai' 2>/dev/null || true
          uci -q set system.@system[0].zonename='Asia/Shanghai' 2>/dev/null || true
          uci -q commit system 2>/dev/null || true

          # 想改默认后台 IP，解开下面一行并按你的网段改
          # sed -i 's/option ipaddr.*/option ipaddr '"'"'192.168.2.1'"'"'/' package/base-files/etc/config/network 2>/dev/null || true

          # 想改默认 root 密码（生成 sha256 哈希：openssl passwd -6 你的密码）
          # sed -i "s|root:\*:0:99999:7:::|root:$1$xxxxx$yyyyy:0:99999:7:::|" package/base-files/etc/shadow 2>/dev/null || true

          # ---------- 2) 把无线默认配置按"稳"来写（2.4G 20/40MHz 自动 + 5G 非 DFS 信道）----------
          # mkdir -p files/etc/config
          # cat > files/etc/config/wireless <<'EOF'
          # config wifi-device 'radio0'
          #   option type 'mac80211'
          #   option path 'pci0000:00/0000:00:00.0'
          #   option channel '6'
          #   option band '2g'
          #   option htmode 'HE20'
          #   option disabled '0'
          # config wifi-iface 'default_radio0'
          #   option device 'radio0'
          #   option network 'lan'
          #   option mode 'ap'
          #   option ssid 'OpenWrt'
          #   option encryption 'psk2'
          #   option key 'password'
          # EOF

          # ---------- 3) 加一个开机自愈 cron（每 5 分钟看无线/网口，掉线重启无线）----------
          # mkdir -p files/etc/crontabs
          # cat > files/etc/crontabs/root <<'EOF'
          # */5 * * * * ping -c1 -w2 192.168.1.1 >/dev/null 2>&1 || (wifi down; sleep 2; wifi up)
          # 03 04 * * * * /usr/bin/logrotate -f /etc/logrotate.conf >/dev/null 2>&1
          # EOF

          echo "[diy.sh] done"

          '''
          data = src.lstrip('\n')
          open('diy.sh', 'w').write(data)
          print('[diy.sh] lines =', len(data.splitlines()))
          PYEOF
          chmod +x diy.sh
          bash -n diy.sh && echo '[diy.sh] syntax OK'
          ls -l config.minimal diy.sh

      - name: '4 生成 .config（自动探测 jdcloud_re-ss-01 设备符号）'
        run: |
          cp config.minimal .config
          make defconfig

          python3 - <<'PYEOF' || true
          import glob, re
          pat = re.compile(r'(TARGET_[A-Z0-9_]*DEVICE_[A-Z0-9_]*)')
          found = set()
          files = glob.glob('target/linux/qualcommax/**', recursive=True)
          files += glob.glob('target/linux/qualcommax/**/Config.in', recursive=True)
          files += glob.glob('package/**/Config.in', recursive=True)
          for f in files:
              try:
                  t = open(f, errors='ignore').read()
              except Exception:
                  continue
              if 'jdcloud_re-ss-01' in t.lower():
                  found |= set(pat.findall(t.upper()))
          lines = '\n'.join('CONFIG_%s=y' % s for s in sorted(found)) + '\n'
          if lines.strip():
              open('.config', 'a').write(lines)
          print('[device-symbols]', sorted(found))
          PYEOF

          if [ -n "${{ github.event.inputs.device_symbol }}" ]; then
            SYM="${{ github.event.inputs.device_symbol }}"
            sed -i "/CONFIG_TARGET_.*DEVICE_.*=y/d" .config
            echo "CONFIG_${SYM}=y" >> .config
            echo "[manual-symbol] $SYM"
          fi

          sed -i 's/^[[:space:]]*//' .config
          printf '%s\n' \
            'CONFIG_TARGET_qualcommax=y' \
            'CONFIG_TARGET_qualcommax_ipq60xx=y' \
            'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
            'CONFIG_TARGET_ROOTFS_UBI=y' \
            >> .config
          make defconfig
          echo "=============== .config 摘要 ==============="
          grep -E "^(CONFIG_TARGET|CONFIG_PACKAGE_(kmod-ath11k|kmod-qca-nss|qca-nss|nss-firmware|ath11k-firmware|luci-base|luci-app))" .config | head -60
          echo "============================================"

          echo "=== 自检：config.minimal 里写错/不存在的包名 ==="
          grep '^CONFIG_PACKAGE_' config.minimal | sort -u | while read -r line; do
            p=${line#CONFIG_PACKAGE_}
            p=${p%%=*}
            if grep -q "^CONFIG_PACKAGE_${p} is not set" .config; then
              echo "[WARN] 包不存在或被剔除：${p}（检查拼写或该分支是否提供）"
            fi
          done
          echo "=== 自检结束（只是提醒，不会中断编译）==="

      - name: '5 个性化（diy.sh）'
        run: bash diy.sh

      - name: '6 拉取 feeds'
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a || ./scripts/feeds install -a
          make defconfig

      - name: '7 预下载 dl'
        run: make download -j${{ github.event.inputs.nthreads || '4' }} || true

      - name: '8 开始编译'
        run: |
          make -j${{ github.event.inputs.nthreads || '4' }} BUILD_LOG_BUILD=build.log
          tail -n 60 build.log 2>/dev/null || true

      - name: '9 收集产物'
        id: out
        run: |
          cd bin/targets/qualcommax/ipq60xx || exit 1
          ls -lh | head -40
          cd "$GITHUB_WORKSPACE"
          ART=$(find bin -maxdepth 2 -type f \( -name '*jdcloud_re-ss-01*' -o -name 'sha256sums' -o -name '*.manifest' \) | sort)
          echo "$ART"
          {
            echo 'files<<EOF'
            echo "$ART"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: '10 上传 Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-nss-jdcloud_re-ss-01-${{ github.run_number }}
          path: |
            bin/targets/qualcommax/ipq60xx/*jdcloud_re-ss-01*.bin
            bin/targets/qualcommax/ipq60xx/sha256sums
            bin/targets/qualcommax/ipq60xx/*.manifest
          if-no-files-found: error
          retention-days: 90

      - name: '11 打 Release（可选）'
        if: ${{ github.event.inputs.make_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          name: LibWrt-NSS-jdcloud_re-ss-01-r${{ github.run_number }}
          tag_name: r${{ github.run_number }}
          files: |
            bin/targets/qualcommax/ipq60xx/*jdcloud_re-ss-01-squashfs-factory.bin
            bin/targets/qualcommax/ipq60xx/*jdcloud_re-ss-01-squashfs-sysupgrade.bin
            bin/targets/qualcommax/ipq60xx/*jdcloud_re-ss-01-squashfs-recovery.bin
            bin/targets/qualcommax/ipq60xx/sha256sums
          body: |
            源码：Bet5521/LibWrt @ 25.12-nss（满血 NSS）
            目标：qualcommax/ipq60xx · jdcloud_re-ss-01（京东云 AX1800 Pro 亚瑟）
            产物：factory=U-Boot 首刷 / sysupgrade=在线升级 / recovery=救砖
            注意：刷机前后 mmcblk0p18 需为 2G 大分区布局
